<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d16"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Blue Vault Authenticator</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#121a2a;--line:#263650;--blue:#5da9ff;--muted:#9eacc2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101d32,var(--bg) 45%);color:#f4f7ff;font:16px system-ui,-apple-system,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:620px;margin:auto;padding:22px 0 40px}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}header img{width:44px}h1{font-size:23px;margin:0}p{color:var(--muted)}.panel,.account{background:#121a2a;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
button,.filebtn{border:0;border-radius:12px;padding:13px 16px;background:#2469b7;color:white;font-weight:650;font-size:15px;margin:4px 4px 4px 0}
button.secondary,.filebtn.secondary{background:#26344b}button.danger{background:#803b49}input{width:100%;background:#080e19;color:white;border:1px solid var(--line);border-radius:10px;padding:13px;margin:6px 0 12px;font-size:16px}
label{display:block;color:#cbd7e9;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:6px}.accounttop{display:flex;justify-content:space-between;align-items:center;gap:10px}.issuer{font-weight:700}.user{color:var(--muted);font-size:13px}.code{font: bold 32px ui-monospace,monospace;letter-spacing:5px;margin:14px 0 4px}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}#camera{width:100%;border-radius:12px;background:#000}a{color:var(--blue)}
</style></head>
<body><main>
<header><img src="icon.svg"><div><h1>Blue Vault Authenticator</h1><div class="small">Tvoje kódy. Jen v tomto zařízení.</div></div></header>
<section id="lock" class="panel"><h2>Odemknout trezor</h2><p>Trezor je šifrovaný heslem a uložený pouze v tomto zařízení.</p><label for="password">Hlavní heslo</label><input id="password" type="password" autocomplete="current-password" placeholder="Zadej silné heslo"><div class="actions"><button id="unlock">Odemknout / vytvořit trezor</button></div><p class="small">Zapamatuj si heslo. Bez něj nelze obnovit uložené kódy.</p></section>
<section id="app" class="hidden">
<div class="actions"><button id="scan">Skenovat QR kód</button><label class="filebtn secondary">Načíst QR z Fotek<input id="qrfile" type="file" accept="image/*" hidden></label><button class="secondary" id="manual">Přidat ručně</button><button class="secondary" id="backup">Export zálohy</button><label class="filebtn secondary">Import zálohy<input id="restore" type="file" accept="application/json" hidden></label></div>
<div id="scanner" class="panel hidden"><video id="camera" playsinline></video><p class="small">Namiř kameru na QR kód otpauth://. <button class="danger" id="stop">Zavřít kameru</button></p></div>
<div id="add" class="panel hidden"><h3>Přidat účet</h3><label>Název služby</label><input id="issuer" placeholder="Google"><label>Uživatelský účet</label><input id="account" placeholder="email@example.com"><label>Tajný klíč (Base32)</label><input id="secret" autocapitalize="characters" placeholder="JBSWY3DPEHPK3PXP"><div class="actions"><button id="save">Uložit účet</button><button class="secondary" id="cancel">Zrušit</button></div></div>
<div id="accounts"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script src="app.js"></script></body></html>
